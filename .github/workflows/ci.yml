name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/native]

# A new push to a pull request cancels that PR's older runs. Runs on the
# default branch are never cancelled once started.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout coil-time
        uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-time
          path: .ci/coil-time
          submodules: false

      # This branch tracks coil-lang `feature/native`, which the `edge`
      # release (a snapshot of main) does not have yet: build coil from it.
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-lang
          ref: feature/native
          path: .coil-lang

      - uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-stdlib
          ref: feature/native
          path: .coil-stdlib

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .coil-lang

      - name: Build coil (feature/native)
        id: coil
        run: |
          set -euo pipefail
          cargo build --release --manifest-path .coil-lang/Cargo.toml --bin coil --bin coil-test
          echo "$PWD/.coil-lang/target/release" >> "$GITHUB_PATH"
          echo "stdlib=$PWD/.coil-stdlib/src" >> "$GITHUB_OUTPUT"

      - name: Language harness (`coil test`)
        run: |
          coil test \
            --allow-read --allow-write \
            --root src \
            --root "${{ steps.coil.outputs.stdlib }}" \
            --root .ci/coil-time/src
